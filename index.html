<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>JS - Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>Time:
                        <span id="time">00:00</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>Score:
                        <span id="score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>High Score:
                        <span id="high-score">0</span>
                    </h3>
                </div>
            </div>
            <div class="board"></div>
        </section>
    </main>
    <div class="modal">
        <div class="start-game">
            <h2>Welcome to Snake Game</h2>
            <button class="btn btn-start">Start Game</button>
            <button class="btn btn-reset">Reset High Score</button>
        </div>
        
        <div class="restart-game">
            <h2>Game Over!</h2>
            <button class="btn btn-restart">Restart Game</button>
            <button class="btn btn-menu">Main Menu</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
